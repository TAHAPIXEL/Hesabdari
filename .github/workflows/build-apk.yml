name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Hesabdari APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Bundle offline web assets (HTML, SW, 15 Abar fonts, accounting icons)
        run: |
          DEST="android-app/app/src/main/assets/web"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp public/hsab.html "$DEST/hsab.html"
          cp public/sw.js "$DEST/sw.js"
          cp public/manifest.webmanifest "$DEST/manifest.webmanifest"
          cp public/favicon.ico "$DEST/favicon.ico"
          cp -r public/fonts "$DEST/fonts"
          cp -r public/icons "$DEST/icons"
          ls -la "$DEST"

      - name: Prepare Persistent Release Signing Keystore
        run: |
          KS_PATH="$RUNNER_TEMP/novin-release.p12"
          base64 -d android-app/signing/release.p12.b64 > "$KS_PATH"
          keytool -list -keystore "$KS_PATH" -storetype PKCS12 -storepass novin123456
          echo "NOVIN_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "NOVIN_KEYSTORE_PASSWORD=novin123456" >> "$GITHUB_ENV"
          echo "NOVIN_KEY_ALIAS=novin" >> "$GITHUB_ENV"
          echo "NOVIN_KEY_PASSWORD=novin123456" >> "$GITHUB_ENV"

      - name: Assemble Signed Release APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signature & Prepare Release Assets
        run: |
          APK_SRC=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          cp "$APK_SRC" hesabdari.apk
          cp "$APK_SRC" novin-ashpazkhaneh.apk
          ls -lh hesabdari.apk novin-ashpazkhaneh.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose hesabdari.apk
          fi

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-apk
          path: hesabdari.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v1.0.3 + update older tags)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.3"
          TITLE="اپلیکیشن اندروید حسابداری — فروشگاه نوین آشپزخانه (نسخه ۱.۰.۳)"
          NOTES="نسخهٔ ۱.۰.۳ اپلیکیشن اندروید **حسابداری** (فروشگاه **نوین آشپزخانه**):
          - نام برنامه **حسابداری** با لوگوی اختصاصی موضوع حسابداری (دفتر کل، ماشین‌حساب و نمودار مالی) و نام فروشگاه **نوین آشپزخانه** در داخل برنامه
          - رفع کامل صفحهٔ سیاه دوربین بارکدخوان و فعال‌سازی موتور ترکیبی اسکن زنده (ZXing + BarcodeDetector روی تک‌استریم زندهٔ دوربین)
          - ساخت خودکار پوشهٔ اصلی **حسابداری** در حافظهٔ اصلی گوشی و ذخیرهٔ ۱۰۰٪ تمام فایل‌های خروجی و دانلودی برنامه مستقیماً در پوشهٔ **حسابداری**
          - نمایش دقیق زیر نوار کنترل‌سنتر و وضعیت بالای گوشی (مشابه همدل) بدون کرش و با پشتیبانی کامل آفلاین و همگام‌سازی ابری."
          for OLD_TAG in "v1.0.0" "v1.0.1" "v1.0.2"; do
            if gh release view "$OLD_TAG" >/dev/null 2>&1; then
              gh release upload "$OLD_TAG" hesabdari.apk novin-ashpazkhaneh.apk --clobber || true
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" hesabdari.apk novin-ashpazkhaneh.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" hesabdari.apk novin-ashpazkhaneh.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
