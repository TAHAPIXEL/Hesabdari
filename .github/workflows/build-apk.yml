name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Hesabdari APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Bundle offline web assets (HTML, SW, 15 Abar fonts, accounting icons)
        run: |
          DEST="android-app/app/src/main/assets/web"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp public/hsab.html "$DEST/hsab.html"
          cp public/sw.js "$DEST/sw.js"
          cp public/manifest.webmanifest "$DEST/manifest.webmanifest"
          cp public/favicon.ico "$DEST/favicon.ico"
          cp -r public/fonts "$DEST/fonts"
          cp -r public/icons "$DEST/icons"
          ls -la "$DEST"

      - name: Prepare Persistent Release Signing Keystore
        run: |
          KS_PATH="$RUNNER_TEMP/novin-release.p12"
          base64 -d android-app/signing/release.p12.b64 > "$KS_PATH"
          keytool -list -keystore "$KS_PATH" -storetype PKCS12 -storepass novin123456
          echo "NOVIN_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "NOVIN_KEYSTORE_PASSWORD=novin123456" >> "$GITHUB_ENV"
          echo "NOVIN_KEY_ALIAS=novin" >> "$GITHUB_ENV"
          echo "NOVIN_KEY_PASSWORD=novin123456" >> "$GITHUB_ENV"

      - name: Assemble Signed Release APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signature & Prepare Release Assets
        run: |
          APK_SRC=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          cp "$APK_SRC" hesabdari.apk
          cp "$APK_SRC" novin-ashpazkhaneh.apk
          ls -lh hesabdari.apk novin-ashpazkhaneh.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose hesabdari.apk
          fi
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging hesabdari.apk)
            echo "$BADGING" | head -n 25
            echo "$BADGING" | grep -q "name='ir.hesabdari.novin'"
            echo "$BADGING" | grep -q "versionName='1.0.7'"
            echo "$BADGING" | grep -q "versionCode='10'"
            echo "$BADGING" | grep -q "حسابداری"
          fi

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-apk
          path: hesabdari.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v1.0.7 + update older tags)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.7"
          TITLE="اپلیکیشن اندروید حسابداری — فروشگاه نوین آشپزخانه (نسخه ۱.۰.۷)"
          cat <<'EOF' > release-notes.md
          نسخهٔ ۱.۰.۷ اپلیکیشن اندروید **حسابداری** (فروشگاه **نوین آشپزخانه**):
          - **اصلاح ریشه‌ای فاصله‌ها از لبه‌های صفحه و بین تمام باکس‌ها و متون:** حاشیهٔ ایمن ۲۰ پیکسلی در موبایل و ۴۰ پیکسلی در دسکتاپ، فضای تنفس کامل زیر هدر و بالای نوار ناوبری، و فاصلهٔ دقیق بین تمام عنوان‌ها، زیرعنوان‌ها، کارت‌ها و دکمه‌ها
          - **اصلاح آبشار لایه‌های Tailwind CSS v4 (`@layer components` / `@layer utilities`) و عبارات `calc()`:** عملکرد ۱۰۰٪ دقیق کلاس‌های ریسپانسیو و Safe-Area در مرورگر و WebView اندروید
          - **هماهنگی کامل و دقیق تم روز (Crystal Daylight) و تم شب (Aurora Neo-Dark):** کالیبراسیون اختصاصی کارت قهرمان، نوار صندوق شناور، فرم‌ها، هدر، تب‌بار و نوارهای وضعیت/ناوبری بومی اندروید در هر دو تم روز و شب
          - **ارتقای کش آفلاین به `v13` و نصب مستقیم روی نسخهٔ قبلی بدون حذف اطلاعات کاربر.**
          EOF

          upload_assets_to_release() {
            local rel_id="$1"
            local existing
            existing=$(curl -fsSL --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$rel_id/assets" || echo "[]")
            for FILE in hesabdari.apk novin-ashpazkhaneh.apk; do
              local aid
              aid=$(echo "$existing" | jq -r --arg n "$FILE" '.[] | select(.name == $n) | .id' | head -n 1)
              if [ -n "$aid" ] && [ "$aid" != "null" ]; then
                curl -fsSL --retry 3 --retry-delay 2 -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/assets/$aid" || true
              fi
              curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/vnd.android.package-archive" \
                --data-binary "@$FILE" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$rel_id/assets?name=$FILE" >/dev/null
              echo "Uploaded $FILE to release $rel_id"
            done
          }

          git tag -f "$TAG" "${{ github.sha }}"
          for i in 1 2 3 4; do
            git push origin "refs/tags/$TAG" --force && break || sleep 3
          done

          jq -n \
            --arg tag "$TAG" \
            --arg name "$TITLE" \
            --rawfile body release-notes.md \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}' > release-payload.json

          REL_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null | jq -r '.id // empty' || true)

          if [ -n "$REL_ID" ]; then
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d @release-payload.json \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID" >/dev/null
          else
            REL_ID=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d @release-payload.json \
              "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '.id')
          fi

          upload_assets_to_release "$REL_ID"
          echo "Release $TAG ($REL_ID) published as Latest!"

          OLD_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0.6" 2>/dev/null | jq -r '.id // empty' || true)
          if [ -n "$OLD_ID" ]; then
            upload_assets_to_release "$OLD_ID" || true
          fi
