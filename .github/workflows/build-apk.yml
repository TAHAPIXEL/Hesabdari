name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Hesabdari APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Bundle offline web assets (HTML, SW, 15 Abar fonts, accounting icons)
        run: |
          DEST="android-app/app/src/main/assets/web"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp public/hsab.html "$DEST/hsab.html"
          cp public/sw.js "$DEST/sw.js"
          cp public/manifest.webmanifest "$DEST/manifest.webmanifest"
          cp public/favicon.ico "$DEST/favicon.ico"
          cp -r public/fonts "$DEST/fonts"
          cp -r public/icons "$DEST/icons"
          ls -la "$DEST"

      - name: Prepare Persistent Release Signing Keystore
        run: |
          KS_PATH="$RUNNER_TEMP/novin-release.p12"
          base64 -d android-app/signing/release.p12.b64 > "$KS_PATH"
          keytool -list -keystore "$KS_PATH" -storetype PKCS12 -storepass novin123456
          echo "NOVIN_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "NOVIN_KEYSTORE_PASSWORD=novin123456" >> "$GITHUB_ENV"
          echo "NOVIN_KEY_ALIAS=novin" >> "$GITHUB_ENV"
          echo "NOVIN_KEY_PASSWORD=novin123456" >> "$GITHUB_ENV"

      - name: Assemble Signed Release APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signature & Prepare Release Assets
        run: |
          APK_SRC=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          cp "$APK_SRC" hesabdari.apk
          cp "$APK_SRC" novin-ashpazkhaneh.apk
          ls -lh hesabdari.apk novin-ashpazkhaneh.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose hesabdari.apk
          fi
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging hesabdari.apk)
            echo "$BADGING" | head -n 25
            echo "$BADGING" | grep -q "name='ir.hesabdari.novin'"
            echo "$BADGING" | grep -q "versionName='1.0.6'"
            echo "$BADGING" | grep -q "versionCode='9'"
            echo "$BADGING" | grep -q "حسابداری"
          fi

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabdari-apk
          path: hesabdari.apk
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases (v1.0.6 + update older tags)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.6"
          TITLE="اپلیکیشن اندروید حسابداری — فروشگاه نوین آشپزخانه (نسخه ۱.۰.۶)"
          NOTES="نسخهٔ ۱.۰.۶ اپلیکیشن اندروید **حسابداری** (فروشگاه **نوین آشپزخانه**):
          - **بازطراحی کامل و بی‌نقص ریسپانسیو و ظاهر برنامه با Tailwind CSS v4:** چیدمان دقیق برای موبایل‌های کوچک، استاندارد، تبلت و دسکتاپ بدون اسکرول افقی
          - **مهندسی ارگونومیک جایگاه دکمه‌ها:** جداسازی کامل دکمه‌های حذف (\`d-soft\`) از دکمه‌های ذخیره/ثبت، دکمهٔ تمام‌عرض ثبت فاکتور در گام ۴، انتقال پاک‌سازی سبد به هدر کارت، تب فروش دقیقاً در مرکز نوار پایین موبایل، و دکمه‌های برچسب‌دار «بازگشت» با جهت استاندارد فارسی در زیرصفحه‌ها
          - **چیدمان دوتایی صندوق فروش و سایدبار کامل در دسکتاپ:** اقلام و سابقه در ستون راست + پنل تسویه و ثبت فاکتور چسبان (Sticky) در ستون چپ، به همراه کلیدهای کپسولی مدرن (\`Switch\`)
          - **هماهنگی کامل هر دو تم تیره (Aurora Neo-Dark \`#070B14\`) و روشن (Crystal Daylight \`#EEF2F9\`):** تطبیق هدر، تب‌بار، سایدبار و نوارهای وضعیت/ناوبری بومی اندروید، همراه با ارتقای کش آفلاین به \`v12\` و حفظ ۱۰۰٪ داده‌های قبلی هنگام نصب روی نسخهٔ پیشین."
          for OLD_TAG in "v1.0.0" "v1.0.1" "v1.0.2" "v1.0.3" "v1.0.4" "v1.0.5"; do
            if gh release view "$OLD_TAG" >/dev/null 2>&1; then
              gh release upload "$OLD_TAG" hesabdari.apk novin-ashpazkhaneh.apk --clobber || true
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" hesabdari.apk novin-ashpazkhaneh.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" hesabdari.apk novin-ashpazkhaneh.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
