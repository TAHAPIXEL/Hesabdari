plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.novinashpazkhaneh.hesabdari'
    compileSdk 35

    defaultConfig {
        applicationId "ir.hesabdari.novin"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "1.0.7"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("NOVIN_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("NOVIN_KEYSTORE_PASSWORD") ?: "novin123456"
                keyAlias System.getenv("NOVIN_KEY_ALIAS") ?: "novin"
                keyPassword System.getenv("NOVIN_KEY_PASSWORD") ?: "novin123456"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
